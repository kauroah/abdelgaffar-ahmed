<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Page not found | Ahmed Abdelgaffar</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Outfit", "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #ededed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(255 255 255 / 5%), transparent 48%),
          #0a0a0a;
      }

      main {
        width: min(100%, 38rem);
        text-align: center;
      }

      .eyebrow {
        color: #a3a3a3;
        font: 500 0.75rem/1.5 "JetBrains Mono", Consolas, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1.25rem 0 0;
        font: 400 clamp(6rem, 24vw, 11rem)/0.85 Georgia, serif;
        letter-spacing: -0.08em;
      }

      h2 {
        margin: 2rem 0 0.75rem;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 500;
      }

      p {
        margin: 0 auto;
        max-width: 28rem;
        color: #a3a3a3;
        font-size: 1rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid #ededed;
        border-radius: 9999px;
        background: #ededed;
        color: #0a0a0a;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 160ms ease, color 160ms ease;
      }

      a:hover {
        background: transparent;
        color: #ededed;
      }

      a:focus-visible {
        outline: 2px solid #ededed;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Ahmed Abdelgaffar · Portfolio</div>
      <h1>404</h1>
      <h2>This page took a wrong turn.</h2>
      <p>The address may be outdated, or the page may have moved. Let’s get you back to the portfolio.</p>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
